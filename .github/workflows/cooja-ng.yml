# Run the Cooja simulation test suite with Cooja-NG (CoNGSim) instead of Cooja.
#
# Experimental / measurement workflow. Cooja-NG is a C re-implementation of the
# parts of Cooja + MSPSim that the test suite needs (no JVM, no Gradle). It is
# fetched as a prebuilt release tarball, so the only work on the runner is
# compiling the test firmware and running the simulations.
#
# Runs the same tests/??-*/??-*.csc files as the "CI" workflow; one job per
# test directory so the wall-clock time can be compared side by side with the
# Cooja-based jobs, plus one job running the whole suite in a single go.
name: Cooja-NG

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop, release-* ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  COOJA_NG_REPO: joakimeriksson/cooja-ng
  COOJA_NG_VERSION: v0.2.0
  DOCKER_BASE_IMG: contiker/contiki-ng
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ANALYTICS: 1

jobs:
  Cooja-NG:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-15-intel ]
        # Directory glob passed to run-cooja-tests.sh; "all" runs everything
        # (all 93 tests, TUN included: tunslip6 and border-router.native both
        # support utun on macOS, and the runners have passwordless sudo).
        test: [ all, simulation-base, ipv6, ieee802154, rpl-lite, rpl-classic, tun-rpl-br, security-protocols ]
    name: ${{ matrix.test }}/${{ matrix.os == 'macos-15-intel' && 'macos-x64' || matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout github repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
        submodules: 'recursive'
        persist-credentials: false

    - name: Download Cooja-NG release
      run: |
        case "${{ matrix.os }}" in
          ubuntu-latest)  TARGET=linux-x86_64 ;;
          macos-15-intel) TARGET=macos-x64 ;;
        esac
        PKG=cooja-ng-$COOJA_NG_VERSION-$TARGET
        URL=https://github.com/$COOJA_NG_REPO/releases/download/$COOJA_NG_VERSION
        curl -sSfL -o $PKG.tar.gz $URL/$PKG.tar.gz
        curl -sSfL -o SHA256SUMS $URL/SHA256SUMS
        grep " $PKG.tar.gz\$" SHA256SUMS | shasum -a 256 -c -
        tar xzf $PKG.tar.gz
        mv $PKG cooja-ng
        # The v0.2.0 tarball lacks the serial-socket host wrapper that
        # csc2json.py points the 17-tun-rpl-br tests at; take it from the
        # tag until a release ships it (joakimeriksson/cooja-ng#14).
        if [ ! -f cooja-ng/tools/test-border-router.sh ]; then
          curl -sSfL -o cooja-ng/tools/test-border-router.sh \
            https://raw.githubusercontent.com/$COOJA_NG_REPO/$COOJA_NG_VERSION/tools/test-border-router.sh
          chmod +x cooja-ng/tools/test-border-router.sh
        fi
        echo COOJA_NG_DIR=$(pwd)/cooja-ng >> $GITHUB_ENV
        ./cooja-ng/build/test_runner --version

    - name: install macOS software
      if: matrix.os == 'macos-15-intel'
      run: |
        brew install ccache coreutils make mtr
        wget -nv https://github.com/pjonsson/msp430gcc-binary/releases/download/v1.1/mspgcc-4.7.4-macos-x86_64.tar.bz2
        sudo tar xf mspgcc*.tar.bz2 -C /usr/local --strip-components=1 --no-same-owner
        # GNU make 4.x, GNU tar and GNU coreutils (timeout) first in PATH.
        echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH
        echo "/usr/local/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH
        echo "/usr/local/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH

    # ccache, set up exactly like the CI workflow so firmware build time is
    # comparable: same ccache binary on the host (the action reads stats with
    # it), same cache directory mounted into the container.
    - name: install ccache
      if: matrix.os == 'ubuntu-latest'
      run: |
        wget -nv https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
        sudo tar xf ccache-4.10.2-linux-x86_64.tar.xz -C /usr/bin --strip-components=1 --no-same-owner ccache-4.10.2-linux-x86_64/ccache
        rm -f ccache-*-linux-x86_64.tar.xz

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: cooja-ng-${{ matrix.test }}
        max-size: 160M

    # Same image selection as the CI workflow; fall back to :develop when the
    # per-commit image is not on dockerhub (PRs, forks).
    - name: Pull docker image
      if: matrix.os == 'ubuntu-latest'
      run: |
        tools/docker/print-dockerhash.sh >> $GITHUB_ENV
        source $GITHUB_ENV
        docker pull $DOCKER_IMG || echo DOCKER_IMG=$DOCKER_BASE_IMG:develop >> $GITHUB_ENV

    - name: Execute tests (docker)
      if: matrix.os == 'ubuntu-latest'
      run: |
        set -o pipefail
        PATTERN="??-${{ matrix.test }}"; [ "${{ matrix.test }}" = all ] && PATTERN="*"
        # Border-router tests need TUN + root: run them in the tun-rpl-br job
        # and as part of "all" so that job covers all 93 tests.
        TUN=""
        case "${{ matrix.test }}" in all|tun-rpl-br) TUN="--with-tun" ;; esac
        # Run as root (override the user-remapping entrypoint) so the
        # border-router tests can create a TUN device.
        docker run --privileged --sysctl net.ipv6.conf.all.disable_ipv6=0 \
          --entrypoint bash \
          -v `pwd`:/home/user/contiki-ng \
          -e CONTIKI_DIR=/home/user/contiki-ng \
          -e CI=true \
          -v $GITHUB_WORKSPACE/.ccache:/home/user/.ccache \
          $DOCKER_IMG -c "
            set -e
            cd /home/user/contiki-ng
            # Static version string (as cimake in the CI image) so ccache
            # gets direct hits across runs.
            export RELSTR=citest
            ccache --set-config=max_size=160M
            if [ -n \"$TUN\" ]; then
              make -C tools/serial-io tunslip6
              make -C examples/rpl-border-router TARGET=native border-router.native
            fi
            # Must run from the cooja-ng dir: firmware paths are cwd-relative.
            cd cooja-ng
            time tools/run-cooja-tests.sh $TUN '$PATTERN'
            ccache -s" 2>&1 | tee cooja-ng.log

    # TEMPORARY diagnostic: hello-world.z1 fails to build on macOS in the
    # test runner (sky with the same toolchain is fine) and the firmware
    # build script hides the compiler output.
    - name: z1 build diagnostic (macOS)
      if: matrix.os == 'macos-15-intel' && (matrix.test == 'all' || matrix.test == 'simulation-base')
      run: |
        echo "--- motelist-zolertia-macos -c output (raw):"
        tools/zolertia/motelist-zolertia-macos -c 2>&1 | od -c | head -20 || true
        echo "--- hello-world.z1 build:"
        make -C examples/hello-world -j3 TARGET=z1 hello-world.z1 WERROR=0 COOJA_CI=1 2>&1 | tail -5 || true
        make -C examples/hello-world TARGET=z1 clean >/dev/null 2>&1 || true

    - name: Execute tests (macOS)
      if: matrix.os == 'macos-15-intel'
      run: |
        set -o pipefail
        PATTERN="??-${{ matrix.test }}"; [ "${{ matrix.test }}" = all ] && PATTERN="*"
        TUN=""
        case "${{ matrix.test }}" in all|tun-rpl-br) TUN="--with-tun" ;; esac
        export CONTIKI_DIR=$(pwd)
        export RELSTR=citest
        if [ -n "$TUN" ]; then
          make -C tools/serial-io tunslip6
          make -C examples/rpl-border-router TARGET=native border-router.native
        fi
        # Must run from the cooja-ng dir: firmware paths are cwd-relative.
        cd cooja-ng
        time tools/run-cooja-tests.sh $TUN "$PATTERN" 2>&1 | tee ../cooja-ng.log
        ccache -s

    # run-cooja-tests.sh exits 0 when every test is skipped (e.g. firmware
    # failed to build), so check the result lines explicitly.
    - name: Check outcome
      run: |
        grep -E '^[[:space:]]+Passed: [1-9]' cooja-ng.log
        grep -E '^[[:space:]]+Failed: 0$' cooja-ng.log
        ! grep -E '^[[:space:]]+SKIP .*(missing|no test criteria)' cooja-ng.log
        ! grep -E '^[[:space:]]+Skipped: [1-9]' cooja-ng.log
        ! grep -E '^[[:space:]]+ERROR ' cooja-ng.log

    - name: Summary
      if: always()
      run: |
        {
          echo "### Cooja-NG ${{ matrix.test }} (${{ matrix.os }})"
          echo '```'
          grep -E '^[[:space:]]+(RUN|PASS|FAIL|SKIP|ERROR|NEED)|^[[:space:]]+(Total|Passed|Failed|Skipped|Errors):|^real' cooja-ng.log || true
          echo '```'
        } >> $GITHUB_STEP_SUMMARY

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cooja-ng-${{ matrix.test }}-${{ matrix.os }}
        path: cooja-ng.log
