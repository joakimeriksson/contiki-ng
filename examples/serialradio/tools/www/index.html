<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Radio Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }

        .header {
            background: #16213e;
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 200px 1fr auto;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }

        .header h1 {
            font-size: 1.5em;
            color: #e94560;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 5px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #eee;
            background: #0f3460;
        }

        .nav-links a.active {
            color: #e94560;
            background: #0f3460;
        }

        .status {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #444;
        }

        .led.connected {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .led.disconnected {
            background: #ef4444;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        .visualization-panel {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .visualization-panel h2 {
            margin-bottom: 15px;
            color: #e94560;
            font-size: 1.2em;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            min-height: 300px;
            overflow: hidden;
        }

        #spectrumCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1117;
            border-radius: 5px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            min-height: 0;
        }

        .panel {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
        }

        .panel h3 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1em;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .info-item {
            background: #0f3460;
            padding: 10px;
            border-radius: 5px;
        }

        .info-item label {
            display: block;
            font-size: 0.8em;
            color: #888;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 1.2em;
            font-weight: bold;
            color: #4ade80;
        }

        .current-spectrum {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .channel-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-bar .ch {
            width: 30px;
            font-size: 0.8em;
            color: #888;
        }

        .channel-bar .bar-container {
            flex: 1;
            height: 20px;
            background: #0d1117;
            border-radius: 3px;
            overflow: hidden;
        }

        .channel-bar .bar {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #facc15, #ef4444);
            transition: width 0.1s ease;
        }

        .channel-bar .rssi {
            width: 50px;
            font-size: 0.8em;
            text-align: right;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-row {
            display: flex;
            gap: 10px;
        }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        button:hover {
            background: #d63050;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        button.secondary {
            background: #0f3460;
        }

        button.secondary:hover {
            background: #1a4a7a;
        }

        select, input[type="number"] {
            background: #0d1117;
            color: #eee;
            border: 1px solid #0f3460;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
        }

        .view-toggle button {
            flex: 1;
            padding: 8px;
        }

        .view-toggle button.active {
            background: #4ade80;
        }

        .stats {
            font-size: 0.85em;
            color: #888;
            margin-top: 10px;
        }

        .stats span {
            color: #eee;
        }

        .packets-list {
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75em;
        }

        .packet-placeholder {
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .packet-item {
            background: #0d1117;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            border-left: 3px solid #4ade80;
        }

        .packet-item .packet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: #888;
        }

        .packet-item .packet-data {
            word-break: break-all;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Serial Radio Web Interface</h1>
        <div class="nav-links">
            <a href="index.html" class="active">Spectrum</a>
            <a href="packets.html">Packets</a>
        </div>
        <div class="status">
            <div class="status-item">
                <div class="led" id="wsLed"></div>
                <span>WebSocket</span>
            </div>
            <div class="status-item">
                <span id="scanRate">-- scans/s</span>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="visualization-panel">
            <h2>Spectrum Display</h2>
            <div class="view-toggle">
                <button id="view2d" class="active">2D Spectrum</button>
                <button id="view3d">3D Waterfall</button>
            </div>
            <div class="canvas-container">
                <canvas id="spectrumCanvas"></canvas>
                <div id="plotly3d" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;"></div>
            </div>
            <div class="stats">
                Samples: <span id="sampleCount">0</span> |
                Min: <span id="minRssi">--</span> dBm |
                Max: <span id="maxRssi">--</span> dBm |
                Avg: <span id="avgRssi">--</span> dBm
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>Radio Info</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Channel</label>
                        <div class="value" id="infoChannel">--</div>
                    </div>
                    <div class="info-item">
                        <label>TX Power</label>
                        <div class="value" id="infoTxPower">--</div>
                    </div>
                    <div class="info-item">
                        <label>Band</label>
                        <div class="value" id="infoBand">--</div>
                    </div>
                    <div class="info-item">
                        <label>PAN ID</label>
                        <div class="value" id="infoPanId">--</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>Current RSSI</h3>
                <div class="current-spectrum" id="currentSpectrum">
                    <!-- Channel bars will be inserted here -->
                </div>
            </div>

            <div class="panel">
                <h3>Radio Control</h3>
                <div class="controls">
                    <div class="control-row">
                        <button id="btnScanStart">Start Scan</button>
                        <button id="btnScanStop" class="secondary">Stop Scan</button>
                    </div>
                    <div class="control-row">
                        <button id="btnSniffStart">Start Sniff</button>
                        <button id="btnSniffStop" class="secondary">Stop Sniff</button>
                    </div>
                    <div class="control-row">
                        <label style="line-height: 32px;">Channel:</label>
                        <input type="number" id="channelInput" value="26" min="0" max="128" style="width: 60px;">
                        <button id="btnSetChannel" class="secondary">Set</button>
                    </div>
                    <div class="control-row">
                        <label style="line-height: 32px;">TX Power:</label>
                        <input type="number" id="powerInput" value="0" min="-30" max="20" style="width: 60px;">
                        <button id="btnSetPower" class="secondary">Set</button>
                    </div>
                    <div class="control-row">
                        <button id="btnPing" class="secondary" style="flex:1;">Ping</button>
                        <button id="btnGetInfo" class="secondary" style="flex:1;">Refresh Info</button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>Display Settings</h3>
                <div class="controls">
                    <div class="control-row">
                        <label style="line-height: 32px;">RSSI Range:</label>
                        <input type="number" id="rssiMin" value="-130" style="width: 70px;">
                        <span style="line-height: 32px;">to</span>
                        <input type="number" id="rssiMax" value="-50" style="width: 70px;">
                    </div>
                    <div class="control-row">
                        <label style="line-height: 32px;">History:</label>
                        <input type="number" id="historyLen" value="50" min="10" max="200" style="width: 70px;">
                        <span style="line-height: 32px;">samples</span>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>Received Packets</h3>
                <div class="packets-list" id="packetsList">
                    <div class="packet-placeholder">No packets received yet</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="spectrum.js"></script>
</body>
</html>
